name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend lint + test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fxscalper
          POSTGRES_PASSWORD: fxscalper_dev_password
          POSTGRES_DB: fxscalper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fxscalper -d fxscalper"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check (imports)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://fxscalper:fxscalper_dev_password@localhost:5432/fxscalper
        run: python -c "import app.main; print('imports OK')"

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://fxscalper:fxscalper_dev_password@localhost:5432/fxscalper
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: ci-secret-key
          ENVIRONMENT: test
        run: |
          pytest -q

      - name: Lint (ruff)
        working-directory: backend
        run: |
          pip install ruff
          ruff check app tests || true

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build